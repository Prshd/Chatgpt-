name: Build Smart Reconciliation Windows

on:
  push:
    branches:
      - reconciliation-rebuild
      - v100-sqlite-import-performance
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Smart Reconciliation
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path 'go.mod')) { throw 'go.mod missing' }
          if (!(Test-Path 'main.go')) { throw 'main.go missing' }
          if (!(Test-Path 'static/index.html')) { throw 'static/index.html missing' }

      - name: Download Go dependencies
        shell: pwsh
        run: go mod download

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Build Version 100.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-s -w' -o 'dist/SmartReconciliation.exe' .
          if (!(Test-Path 'dist/SmartReconciliation.exe')) { throw 'Build failed' }

      - name: Package
        shell: pwsh
        run: |
          @(
            '@echo off'
            'cd /d "%~dp0"'
            'start "Smart Reconciliation" "%~dp0SmartReconciliation.exe"'
          ) | Set-Content 'dist/start-smart-reconciliation.bat' -Encoding ASCII
          @(
            'Smart Reconciliation - Version 100.1'
            ''
            'Windows x64 standalone build.'
            'Persistent SQLite database is stored in the Windows user config directory.'
            ''
            'Run start-smart-reconciliation.bat or SmartReconciliation.exe.'
          ) | Set-Content 'dist/README.txt' -Encoding UTF8
          Compress-Archive -Path 'dist/*' -DestinationPath 'SmartReconciliation-v100.1-windows-amd64.zip' -Force

      - name: Upload Version 100
        uses: actions/upload-artifact@v4
        with:
          name: SmartReconciliation-v100.1-windows-amd64
          path: SmartReconciliation-v100.1-windows-amd64.zip
          if-no-files-found: error
